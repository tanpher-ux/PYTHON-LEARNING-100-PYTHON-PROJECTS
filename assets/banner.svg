<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#306998"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g transform="translate(90,90)">
    <circle cx="60" cy="60" r="60" fill="#ffffff"/>
    <text x="60" y="78" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#306998" text-anchor="middle">Py</text>
  </g>

  <text x="230" y="120" font-family="Verdana, Geneva, sans-serif" font-size="50" font-weight="bold" fill="#ffffff">Top 100 Python Projects</text>
  <text x="230" y="160" font-family="Verdana, Geneva, sans-serif" font-size="22" fill="#F5F7FF">From Beginner to Advanced &#8212; 20 categories, 5 projects each</text>

  <g transform="translate(230,190)" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#1a1a1a">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.85"/>
    <text x="65" y="22" text-anchor="middle">100 Projects</text>

    <rect x="145" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.85"/>
    <text x="220" y="22" text-anchor="middle">20 Categories</text>

    <rect x="310" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.85"/>
    <text x="420" y="22" text-anchor="middle">Diagrams + Build Guides</text>
  </g>
</svg>